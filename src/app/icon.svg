<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="38%" r="65%">
      <stop offset="0%" stop-color="#2A1F17" />
      <stop offset="100%" stop-color="#130F0C" />
    </radialGradient>
    <linearGradient id="goldFoil" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FAE5C3" />
      <stop offset="45%" stop-color="#D99B52" />
      <stop offset="100%" stop-color="#B5722E" />
    </linearGradient>
    <linearGradient id="sageLeaf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8FB397" />
      <stop offset="100%" stop-color="#4A6B53" />
    </linearGradient>
  </defs>

  <!-- Rounded Roasted Espresso Badge -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#bgGlow)" />
  <rect x="2" y="2" width="60" height="60" rx="15" stroke="url(#goldFoil)" stroke-width="2" />
  <rect x="6" y="6" width="52" height="52" rx="11.5" stroke="#D99B52" stroke-opacity="0.28" stroke-width="1" />

  <!-- Rising Espresso & Tea Steam Curves -->
  <path
    d="M25 19C25 16.2 27.5 15.2 27.5 12.5"
    stroke="url(#goldFoil)"
    stroke-width="1.8"
    stroke-linecap="round"
  />
  <path
    d="M32 18C32 14.8 34.8 13.8 34.8 10.5"
    stroke="url(#goldFoil)"
    stroke-width="1.8"
    stroke-linecap="round"
  />

  <!-- Botanical Tea Leaf Accent -->
  <path
    d="M39 18.5C43.5 14 48.5 15 48.5 15C48.5 15 49 20 44.5 23.5C41.8 25.6 38.5 24.5 38.5 24.5C38.5 24.5 37.2 20.3 39 18.5Z"
    fill="url(#sageLeaf)"
  />

  <!-- Artisanal Caffè & Tè Cup Silhouette -->
  <path
    d="M17 24H43V32C43 39.1797 37.1797 45 30 45C22.8203 45 17 39.1797 17 32V24Z"
    fill="#1A130E"
    stroke="url(#goldFoil)"
    stroke-width="2.2"
    stroke-linejoin="round"
  />
  <!-- Cup Handle -->
  <path
    d="M43 27H46.5C49.2614 27 51.5 29.2386 51.5 32C51.5 34.7614 49.2614 37 46.5 37H42.2"
    stroke="url(#goldFoil)"
    stroke-width="2.2"
    stroke-linecap="round"
  />

  <!-- Monogram "C&T" Inside Cup -->
  <text
    x="30"
    y="36.5"
    text-anchor="middle"
    fill="#FAF3E8"
    font-family="Georgia, 'Times New Roman', serif"
    font-size="10.5"
    font-weight="700"
    letter-spacing="0.6"
  >
    C&amp;T
  </text>

  <!-- Saucer Line -->
  <path
    d="M15 49.5H45"
    stroke="url(#goldFoil)"
    stroke-width="2.2"
    stroke-linecap="round"
  />
</svg>
